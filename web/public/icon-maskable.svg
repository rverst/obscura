<!-- Maskable: the important content stays inside the safe zone, so a launcher
     cropping this to a circle does not clip the aperture. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="obscura">
  <rect width="512" height="512" fill="#0e0e10"/>
  <circle cx="256" cy="256" r="104" fill="none" stroke="#6d8cff" stroke-width="22"/>
  <circle cx="256" cy="256" r="46" fill="#6d8cff"/>
</svg>
