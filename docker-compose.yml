services:
  obscura:
    build:
      context: .
      target: runtime
    image: obscura:dev
    ports:
      # Bound to loopback on purpose. obscura speaks plain http; TLS belongs in
      # a reverse proxy in front of it. Exposing this straight to the network
      # would send the password over the wire in the clear.
      #
      # Reach it as http://localhost:8080. The address form works for
      # everything except passkeys, which need a hostname as the relying party
      # ID and are reported as unavailable there.
      - "127.0.0.1:8080:8080"
    volumes:
      - obscura-data:/data
    tmpfs:
      # libvips falls back to a memory-mapped temp file for images too large to
      # hold in RAM. Backing /tmp with tmpfs keeps that copy out of persistent
      # storage -- otherwise plaintext could survive on disk behind the
      # encryption.
      - /tmp:size=512m,mode=1777
    restart: unless-stopped
    # -dev drops the cookie's Secure flag, which is required to reach the app
    # over http://localhost. Remove it once a TLS proxy is in front.
    command: ["-addr", "0.0.0.0:8080", "-data", "/data", "-dev"]

volumes:
  obscura-data:
